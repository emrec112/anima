[package]
name = "anima"
version = "0.1.0"
edition = "2024"
description = "Anima — a lightweight live wallpaper engine for Linux"
license = "MIT"

[lib]
name = "anima"
path = "src/lib.rs"

[[bin]]
name = "animad"
path = "src/bin/animad.rs"

[[bin]]
name = "anima"
path = "src/bin/anima.rs"

[dependencies]
smithay-client-toolkit = "0.19.1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
glutin = "0.32"
raw-window-handle = "0.6"
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
dirs = "6"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
glam = "0.34.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
